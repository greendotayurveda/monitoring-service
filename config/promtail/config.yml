server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # File-tail container json logs (json-file driver). Distinct from Docker API scrape.
  # Verify this config is live: Promtail must NOT only log "added Docker target".
  - job_name: docker
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          scrape: json-file
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - docker: {}
      - regex:
          expression: '.*/(?P<container_id>[0-9a-f]{64})/.*'
          source: filename
      - labels:
          container_id:
      - labeldrop:
          - filename

  - job_name: journal
    journal:
      max_age: 2h
      path: /var/log/journal
      labels:
        job: systemd-journal
        host: ubuntu-host
    relabel_configs:
      - source_labels: ["__journal__systemd_unit"]
        target_label: unit
      - source_labels: ["__journal__hostname"]
        target_label: hostname
