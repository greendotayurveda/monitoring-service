server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker API scrape (not file-tail). Do NOT use pipeline stage "docker:" here —
  # that stage is for json-file lines; on API scrape it breaks timestamps and
  # drop-older-than then discards every line (job=docker never appears).
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: compose_project
      - target_label: scrape
        replacement: docker-api
    pipeline_stages:
      - drop:
          older_than: 1h
          drop_counter_reason: older_than_1h

  - job_name: journal
    journal:
      max_age: 2h
      path: /var/log/journal
      labels:
        job: systemd-journal
        host: ubuntu-host
    relabel_configs:
      - source_labels: ["__journal__systemd_unit"]
        target_label: unit
      - source_labels: ["__journal__hostname"]
        target_label: hostname
    pipeline_stages:
      - drop:
          older_than: 1h
          drop_counter_reason: older_than_1h
