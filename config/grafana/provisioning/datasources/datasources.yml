apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Loki
    type: loki
    access: proxy
    uid: loki
    # Loki common.path_prefix is /loki — Grafana must include it
    url: http://loki:3100/loki
    editable: false
    jsonData:
      maxLines: 1000
      timeout: 60
