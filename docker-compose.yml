name: monitoring-service

networks:
  monitoring:
    name: monitoring
    driver: bridge

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ms-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - ./data/prometheus:/prometheus
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: ms-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    # No host port — scraped only on the monitoring Docker network
    expose:
      - "9100"
    networks:
      - monitoring
    pid: host
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ms-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    # No host port — avoids clash with existing services on 8080
    expose:
      - "8080"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  loki:
    image: grafana/loki:3.1.1
    container_name: ms-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./config/loki/config.yml:/etc/loki/config.yml:ro
      - ./data/loki:/loki
    # No host port required for Grafana/Promtail on the same network
    expose:
      - "3100"
    networks:
      monitoring:
        aliases:
          - loki
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  promtail:
    image: grafana/promtail:3.1.1
    container_name: ms-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./config/promtail/config.yml:/etc/promtail/config.yml:ro
      - ./data/promtail:/positions
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    networks:
      - monitoring
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  grafana:
    image: grafana/grafana:11.2.2
    container_name: ms-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://127.0.0.1:3010}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Default 3010 — host :3000/:3001 often already used by existing Grafana
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3010}:3000"
    networks:
      - monitoring
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ms-alertmanager
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./scripts/alertmanager-entrypoint.sh:/entrypoint.sh:ro
      - ./config/alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - ./config/alertmanager/templates:/etc/alertmanager/templates:ro
      - ./data/alertmanager:/alertmanager
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    container_name: ms-uptime-kuma
    restart: unless-stopped
    volumes:
      - ./data/uptime-kuma:/app/data
    ports:
      # Default 3002 — host :3001 often taken (e.g. existing grafana container)
      - "${BIND_ADDRESS:-127.0.0.1}:${UPTIME_KUMA_PORT:-3002}:3001"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 256M
