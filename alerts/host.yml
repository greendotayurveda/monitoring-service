groups:
  - name: host.critical
    rules:
      - alert: HostHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Host CPU > 95% ({{ $labels.instance }})"
          description: "CPU usage has been above 95% for 10 minutes."

      - alert: HostHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Host memory > 95% ({{ $labels.instance }})"
          description: "Memory usage has been above 95% for 10 minutes."

      - alert: HostDiskCritical
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint="/"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint="/"})) * 100 > 90
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Root disk > 90% ({{ $labels.instance }})"
          description: "Root filesystem usage has been above 90% for 15 minutes."

      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter down ({{ $labels.instance }})"
          description: "Host metrics scraper is unreachable."

  - name: host.warning
    rules:
      - alert: HostCPUWarning
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU > 80% ({{ $labels.instance }})"

      - alert: HostMemoryWarning
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host memory > 80% ({{ $labels.instance }})"

      - alert: HostDiskWarning
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint="/"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint="/"})) * 100 > 80
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Root disk > 80% ({{ $labels.instance }})"
